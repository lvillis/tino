[package]
name = "tino"
description = "tino: tiny init process (PID 1) for Docker/Kubernetes containers, written in Rust (tini alternative)"
version = "0.1.10"
edition = "2024"
license = "MIT"
authors = ["lvillis <lvillis@outlook.com>"]
repository = "https://github.com/lvillis/tino"
homepage = "https://github.com/lvillis/tino"
documentation = "https://docs.rs/tino"
readme = "README.md"
keywords = ["init", "pid1", "container", "docker", "tini"]
categories = ["command-line-utilities", "os::unix-apis"]
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[dependencies]
clap = { version = "4.5.58", default-features = false, features = ["std", "help", "usage", "derive", "env"] }
anyhow = { version = "1.0.100", default-features = false }
libc = { version = "0.2.180" }
nix = { version = "0.31.1", default-features = false, features = ["process", "signal", "poll"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "env-filter", "std"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[package.metadata.release]
tag-prefix = ""
tag-name = "{{prefix}}{{version}}"
pre-release-commit-message = "chore: release {{crate_name}} version {{version}}"
tag-message = "chore: release {{crate_name}} version {{version}}"
pre-release-hook = ["git", "cliff", "-o", "CHANGELOG.md", "--tag", "{{version}}"]
