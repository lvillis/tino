name: Docker Publish

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: .
  GHCR_IMAGE: ghcr.io/lvillis/tino

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve image tags
        shell: bash
        run: |
          {
            echo 'IMAGE_TAGS<<EOF'
            echo "${{ env.GHCR_IMAGE }}:latest"

            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              version="$(
                git tag --points-at "${{ github.event.workflow_run.head_sha }}" \
                  | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -V \
                  | tail -n 1
              )"
              if [ -z "$version" ]; then
                echo "no version tag found for CI commit ${{ github.event.workflow_run.head_sha }}" >&2
                exit 1
              fi
              echo "${{ env.GHCR_IMAGE }}:${version}"
            fi

            echo EOF
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.1.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          file: Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:latest
          cache-to: type=inline
          tags: ${{ env.IMAGE_TAGS }}
