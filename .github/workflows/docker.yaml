name: Docker Publish

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: .
  GHCR_TAG: ghcr.io/lvillis/tino:latest
  DOCKER_TAG: docker.io/lvillis/tino:latest

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    name: latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to docker.io
        uses: docker/login-action@v4.1.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.1.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          file: Dockerfile
          push: true
          cache-from: type=registry,ref=${{ env.DOCKER_TAG }}
          cache-to: type=inline
          tags: |
            ${{ env.GHCR_TAG }}
            ${{ env.DOCKER_TAG }}
