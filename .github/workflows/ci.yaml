name: CI

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@469810fd82c015d3c43815cd2b0e4d02eecc4819 # v0.1.11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate bundled seccomp profile
        run: |
          python3 -c "import json; json.load(open('seccomp-landlock.json', encoding='utf-8')); print('seccomp-landlock.json OK')"
          test -s seccomp-landlock.upstream.sha

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --all --verbose

  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Build scratch image
        run: docker build --target runtime -t tino:e2e .

      - name: Verify scratch image entrypoint
        run: docker run --rm tino:e2e --help

      - name: Build shell test image
        run: |
          docker build -t tino:e2e-shell -f - . <<'EOF'
          FROM tino:e2e AS tino
          FROM alpine:3.23
          COPY --from=tino /sbin/tino /sbin/tino
          RUN mkdir -p /data/logs
          ENTRYPOINT ["/sbin/tino"]
          EOF

      - name: Verify Landlock with Docker seccomp
        run: |
          seccomp_profile="$(pwd)/seccomp-landlock.json"

          docker run --rm \
            --security-opt "seccomp=${seccomp_profile}" \
            tino:e2e-shell \
            --write-restrict --write-allow /data/logs -- \
            sh -c 'echo ok > /data/logs/ok && test "$(cat /data/logs/ok)" = ok'

          if docker run --rm \
            --security-opt "seccomp=${seccomp_profile}" \
            tino:e2e-shell \
            --write-restrict --write-allow /data/logs -- \
            sh -c 'echo denied > /tmp/deny'; then
            echo "expected write outside /data/logs to fail" >&2
            exit 1
          fi
